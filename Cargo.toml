[package]
name = "pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "JSONL text corpus indexer for training tiny language models"
license = "MIT"
publish = false

[lib]
name = "pipeline"
path = "src/lib.rs"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help"] }
fjall = "3.1"
minicbor = { version = "2.3", features = ["derive", "std"] }
sonic-rs = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
memchr = "2.8"
crossbeam-channel = "0.5"
hashbrown = "0.17"
foldhash = "0.2"
hdrhistogram = "7.6"
regex = "1"
mimalloc = "0.1"
thiserror = "2"
zstd = { version = "0.14", features = ["zstdmt"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
lz4_flex = "0.14"
tiny_http = "0.12"

[dev-dependencies]
proptest = "1"
assert_cmd = "2"
tempfile = "3"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Dependencies stay optimized while our own code is tested with coverage.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
